<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dark Kitchen order</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EDF0F0; --surface:#F8FAFA; --fg:#151D1D; --muted:#5B6767; --line:#D3DADA;
  --accent:#0E6B5C; --accent-fg:#FFFFFF; --tint:#D9EEE8; --danger:#B3261E; --field:#FFFFFF;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0F1515; --surface:#172020; --fg:#E6EEEC; --muted:#93A4A1; --line:#2A3736;
    --accent:#4CC5AC; --accent-fg:#07201B; --tint:#173A33; --danger:#F2867E; --field:#121A1A;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.4;
  padding-top:max(16px,env(safe-area-inset-top,0px)); padding-bottom:130px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:720px;margin:0 auto}
h1{font-family:var(--font-head);font-weight:600;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);margin-top:14px}
.seg button{background:none;border:0;padding:11px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-align:left}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg b{font-family:var(--font-head);font-weight:600;font-size:17px}
.seg small{font-family:var(--font-num);font-size:12px;opacity:.85}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0}
.in{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;color:var(--fg);text-transform:none;letter-spacing:0;width:100%;min-width:0}
textarea.in{resize:vertical;min-height:64px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.filters .in{flex:1 1 160px}
.chip{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--tint);border-color:var(--accent)}
.list{margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line)}
.row.sel{background:var(--tint)}
.nm{font-weight:500;overflow-wrap:anywhere;text-wrap:pretty}
.meta{font-size:12px;color:var(--muted);margin-top:1px}
.step{display:flex;align-items:center;gap:6px}
.step button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--field);font-size:20px;line-height:1;padding:0}
.step input{width:62px;height:36px;text-align:center;font-family:var(--font-num);font-weight:500;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:0 4px}
.row.sel .step input{border-color:var(--accent)}
.unit{font-family:var(--font-num);font-size:12px;color:var(--muted);width:28px}
.sec{padding:14px 10px 6px;font-family:var(--font-head);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.sec small{font-family:var(--font-num);font-size:12px;font-weight:400;color:var(--muted)}
.sec.s1{background:#FFE7B0;color:#5A3A00;border-radius:8px;margin-top:10px}
.sec.s1 small{color:#7A5200}
.row.s1{border-left:4px solid #E69A1A;background:#FFF6E0}
.row.s1.sel{background:#FFE7B0}
.tag1{display:inline-block;background:#E69A1A;color:#2B1A00;border-radius:4px;padding:0 6px;font-size:11px;font-weight:600;margin-left:6px;vertical-align:1px}
@media (prefers-color-scheme: dark){.sec.s1{background:#4A3410;color:#FFD98A}.sec.s1 small{color:#E6BD6E}.row.s1{background:#2A2210;border-left-color:#E69A1A}.row.s1.sel{background:#4A3410}}
.empty{color:var(--muted);padding:24px 10px;text-align:center}
.note{margin:14px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar-t{min-width:0;font-size:13px;color:var(--muted)}
.bar-t b{display:block;color:var(--fg);font-family:var(--font-head);font-size:18px;font-weight:600}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:12px 18px;font-weight:600;font-size:15px;white-space:nowrap}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--field);color:var(--fg);border:1px solid var(--line)}
.status{padding:10px 12px;border-radius:8px;background:var(--tint);margin:14px 0}
.status.bad{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.done h2{font-family:var(--font-head);font-weight:600;font-size:22px;margin:18px 0 6px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bar" id="bar" hidden><div class="bar-in"><div class="bar-t" id="barT"></div><button class="btn" id="send" type="button">Send order</button></div></div>

<script>
(function(){
  /* ВСТАВЬТЕ адрес веб-приложения Apps Script (Deploy → Web app). */
  var API_URL="https://script.google.com/macros/s/AKfycbzGGaUvOpmTgM9qb7T50jvP3-iJaVLIXK8wqpwrgzfcpFel6o9IvSwl6oHAQ6q50nYP/exec";

  var STAFF={Cocoon:["Mar Nyein","Ju Ju","Thawatchai Phongsa"],Luna:["Mew Nge Hein","Han Shine Maung (Hank)"]};

  var tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){try{tg.ready();tg.expand()}catch(e){}}

  /* Сохранённый список на случай, если таблица недоступна. Основной список берётся из вкладок Cocoon / Luna Products. */
  var mk=function(list){return list.map(function(r){return r.length>3?{id:r[0],num:r[1],name:r[2],unit:r[3]}:{num:r[0],name:r[1],unit:r[2]}})};
  var COCOON=[[1,"74 PF Mince beef","kg"],[2,"74 PF Chicken cutlet for bur","pcs"],[3,"74 PF Bolognese sauce","kg"],[4,"74 PF Creamy salmon sauce","kg"],[5,"74 PF Creamy mushroom sauce","kg"],[6,"74 PF Pad Thai sauce","kg"],[7,"74 PF Sourdough bread","pcs"],[9,"74 PF Massaman curry","kg"],[10,"74 PF Red curry sauce","kg"],[11,"74 PF Hummus","kg"],[12,"74 PF Papaya salad sauce","kg"],[13,"74 PF Tomatoe salsa","kg"],[17,"74 PF Braised lamb","kg"],[18,"74 PF Caesar sauce","kg"],[20,"74 PF Tzatziki","kg"],[23,"CHICKEN ROLL FROM PRODUCTION","kg"],[24,"CHICKEN WINGS FOR COCOON FROM PRODUCTION","kg"],[25,"Falafel ","kg"],[26,"74 PF Cheese sauce","kg"],[27,"4 PF Honey musturd sauce","kg"],[28,"74 PF Potato peeling","kg"],[29,"74 PF Granola","kg"],[30,"74 PF Berries sauce","kg"],[31,"74 PF Sweet cream-cheese","kg"],[32,"74 PF Cream cheese","kg"],[33,"74 PF Truffle sauce","kg"],[34,"Big mac sauce s\\f(cocoon)","kg"],[35,"74 PF Risotto rice prep","kg"],[36,"74 PF Chicken parmigana","kg"],[37,"74 PF Chicken parmegana sauce","kg"],[38,"74 PF Octopus sous-vide 1pc 100g new","pcs"],[39,"74 PF Romesco Sauce","kg"],[40,"74 PF Ribeye beef","kg"],[41,"74 PF Peppercorn sauce","kg"],[42,"SEABASS (WHITE SNAP) 1pc 500\\600","pcs"],[43,"74 PF Tapenade salsa","kg"],[44,"Tuna fillet","kg"],[47,"74 PF Chicken breast","kg"],[48,"74 PF Mango shrimp sauce","kg"],[49,"PF seafood for tom yam","kg"],[50,"Mozzarella in breadcrumbs p/f","kg"],[51,"74 PF Blue Cheese Sauce","kg"],[52,"74 PF pickled onion shallots","kg"],[54,"74 PF Salmon fillet without skin","kg"],[55,"74 PF Tenderloin peeled","kg"],[56,"74 PF Tomato butter","kg"],[57,"74 PF Pomelo salad sauce","kg"],[58,"74 PF Baby squid peeling","kg"],[59,"potato wedges","kg"],[60,"Duck breast cocoon p/f","kg"],[63,"74 PF Cucumber smashed","kg"],[64,"74 PF Garlic sauce","kg"],[65,"burger bun","pcs"],[66,"Mayo teriyaki sauce s/f","kg"],[67,"Chili mayo sauce s/f","kg"],[68,"74 PF Apple caramel","kg"],[69,"74 PF Cramble","kg"],[70,"74 PF Peanut caramel","kg"],[71,"74 PF Brownie 1pc 163g","pcs"],[72,"chicken minced","kg"],[74,"BRIOCHE 1*5","pcs"],[75,"74 PF Truffle potato mousse","kg"],[76,"74 PF Salmon fillet","kg"],[77,"74 PF Cauliflower pure","kg"],[78,"74 PF Tom Yam Stock","kg"],[82,"mango - passon fruit for smoothie bowl p/f","kg"],[83,"BONE MARROW","kg"],[87,"Gold BBQ sauce s/f","kg"],[88,"74 PF Pad Kaphrao sauce","kg"],[89,"74 PF Choo chee curry","kg"],[90,"74 PF choo chee paste","kg"],[91,"74 PF Crab soft","kg"],[92,"minced pork","kg"]];
  var LUNA=[["l2",2,"70 PF Brioche bun 1pc","pcs"],["l3",3,"70 PF Brioche dough","kg"],["l5",5,"70 PF Milk bread street 1pc 30g","pcs"],["l7",7,"70 PF Pasta dough","kg"],["l10",10,"70 PF Ravioli dough","kg"],["l18",18,"70 PF Beef broth","kg"],["l20",20,"70 PF Cauliflower puree","kg"],["l22",22,"70 PF Corn mousse","kg"],["l26",26,"70 PF Fish broth","kg"],["l28",28,"70 PF Mashed potatoes","kg"],["l29",29,"70 PF Potatoes graten","kg"],["l30",30,"70 PF Salt for fish","kg"],["l31",31,"70 PF Sweet potato puree","kg"],["l33",33,"70 PF Tomato kimchi","kg"],["l53",53,"70 PF Tenderloin peeled","kg"],["l54",54,"70 PF Wagyu ribeye","kg"],["l55",55,"70 PF Wagyu striploin","kg"],["l57",57,"70 PF Wagyu striploin A5","kg"],["l59",59,"70 PF Artichokes without oil","kg"],["l60",60,"70 PF Pickled shallots","kg"],["lr41","","70 PF Smashed pickles","kg"],["lr42","","70 PF Asian pepper sauce","kg"],["lr43","","70 PF Bisque sauce","kg"],["lr47","","70 PF Chimichurri sauce","kg"],["lr55","","70 PF Hot soy sauce","kg"],["lr56","","70 PF Kimchi tomato sauce","kg"],["lr59","","70 PF Neumo sauce","kg"],["lr60","","70 PF Oyster sauce yuzu","kg"],["lr61","","70 PF Pesto sauce","kg"],["lr62","","70 PF Ponzu sauce","kg"],["lr65","","70 PF Seafood chili sause","kg"],["lr66","","70 PF Spicy mayo sauce","kg"],["lr67","","70 PF Spicy ponzu sauce","kg"],["lr68","","70 PF Tomato sauce","kg"],["lr69","","70 PF Truffle sauce for wagyu","kg"],["lr72","","70 PF Hamachi","kg"],["lr73","","70 PF lobster tail su vide","kg"],["lr74","","70 PF Octopus sous vide","kg"],["lr75","","70 PF Red snaper fillet","kg"],["lr76","","70 PF Salmon fillet on skin","kg"],["lr77","","70 PF Salmon fillet without skin","kg"],["lr78","","70 PF Scallop defrosted","kg"],["lr79","","70 PF Sea bass fillet","kg"],["lr80","","70 PF Shrimp peeling","kg"],["lr81","","70 PF Tuna defrosted","kg"],["lr85","","70 PF Fig confiture","kg"],["lr88","","70 PF Pear jam","kg"]];
  var CAT={Cocoon:mk(COCOON),Luna:mk(LUNA)};
  var ST1=[1,2,3,4,5,6,7,9,10,17,25,35,36,38,40,42,44,47,50,55,58,60,72,76,78,82,83,88,89,90,91,92];
  function setIds(v){CAT[v].forEach(function(x){if(!x.id)x.id=v.charAt(0).toLowerCase()+x.num;if(v==="Cocoon"&&ST1.indexOf(x.num)>=0)x.stage=1})}
  setIds("Cocoon");setIds("Luna");

  function pad(n){return (n<10?"0":"")+n}
  function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function tomorrow(){var d=new Date();d.setDate(d.getDate()+1);return iso(d)}
  function dm(s){var p=s.split("-");if(p.length<3)return s;return pad(+p[2])+"."+pad(+p[1])}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function fmt(q){return String(q).replace(".",",")}
  function parseQ(s){var n=parseFloat(String(s).replace(",","."));return isFinite(n)&&n>0?Math.round(n*100)/100:0}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

  function startVenue(){
    var p="";
    try{p=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||""}catch(e){}
    if(!p)p=(location.hash||"").replace("#","");
    p=p.toLowerCase();
    return p==="luna"?"Luna":(p==="cocoon"?"Cocoon":"");
  }
  var sv=startVenue();
  var S={venue:sv||"Cocoon",locked:!!sv,qty:{Cocoon:{},Luna:{}},cooks:{Cocoon:"",Luna:""},date:tomorrow(),comment:"",q:"",only:false,done:null,busy:false,error:"",live:{Cocoon:false,Luna:false},clientId:uid()};
  try{var d=JSON.parse(localStorage.getItem("dk-miniapp")||"null");if(d){if(d.qty)S.qty=d.qty;if(d.cooks)S.cooks=d.cooks}}catch(e){}
  function persist(){try{localStorage.setItem("dk-miniapp",JSON.stringify({qty:S.qty,cooks:S.cooks}))}catch(e){}}

  var app=document.getElementById("app"),bar=document.getElementById("bar"),barT=document.getElementById("barT"),sendBtn=document.getElementById("send");
  function count(v){return Object.keys(S.qty[v]).length}
  function item(id){return CAT[S.venue].filter(function(x){return x.id===id})[0]}

  function loadCatalog(v){
    if(!/^https:\/\/script\.google\.com\//.test(API_URL))return;
    var ctl=("AbortController" in window)?new AbortController():null;
    var timer=setTimeout(function(){if(ctl)ctl.abort()},12000);
    fetch(API_URL+"?action=catalog&venue="+v,ctl?{signal:ctl.signal}:{}).then(function(r){return r.json()}).then(function(j){
      clearTimeout(timer);
      if(j&&j.ok&&j.items&&j.items.length){
        CAT[v]=j.items;S.live[v]=true;
        Object.keys(S.qty[v]).forEach(function(id){if(!CAT[v].some(function(x){return x.id===id}))delete S.qty[v][id]});
        if(v===S.venue&&!S.done){renderList();renderBar()}
      }
    }).catch(function(){clearTimeout(timer)});
  }

  function renderMain(){
    var v=S.venue;
    var seg=S.locked?"":'<div class="seg" role="group" aria-label="Venue">'+["Cocoon","Luna"].map(function(n){
      return '<button type="button" data-venue="'+n+'" aria-pressed="'+(S.venue===n)+'"><b>'+n+'</b><small>'+(count(n)?count(n)+" selected":"")+'</small></button>';
    }).join("")+'</div>';
    var fields='<div class="fields"><label class="f">For date<input class="in" id="date" type="date" value="'+esc(S.date)+'"></label>'+
      '<label class="f">Ordered by<select class="in" id="cook"><option value="">Select your name</option>'+
      STAFF[v].map(function(n){return '<option'+(S.cooks[v]===n?" selected":"")+'>'+esc(n)+'</option>'}).join("")+'</select></label></div>';
    var filters='<div class="filters"><input class="in" id="q" type="search" placeholder="Search by name" value="'+esc(S.q)+'" autocomplete="off">'+
      '<button class="chip" type="button" id="only" aria-pressed="'+S.only+'">Selected only</button></div>';
    return '<h1>'+(S.locked?"Order · "+v:"Dark Kitchen order")+'</h1><p class="sub">Semi-finished products from Dark Kitchen: choose items and quantities</p>'+
      seg+fields+filters+'<ul class="list" id="list"></ul>'+
      '<label class="f note">Order comment<textarea class="in" id="comment" placeholder="Urgency, time, anything to note">'+esc(S.comment)+'</textarea></label>'+
      (S.error?'<div class="status bad" role="alert">'+esc(S.error)+'</div>':'');
  }
  function rowHtml(x){
    var cur=S.qty[S.venue][x.id]||0;
    return '<li class="row'+(x.stage?" s1":"")+(cur?" sel":"")+'" data-id="'+x.id+'"><div><div class="nm">'+esc(x.name)+(x.stage?'<span class="tag1">Stage 1</span>':'')+'</div><div class="meta">'+(x.num!==""&&x.num!=null?"#"+x.num:"")+'</div></div>'+
      '<div class="step"><button type="button" data-act="minus" aria-label="Less">−</button>'+
      '<input type="text" inputmode="decimal" data-qty value="'+(cur?fmt(cur):"")+'" placeholder="0" aria-label="Quantity, '+esc(x.name)+'">'+
      '<button type="button" data-act="plus" aria-label="More">+</button><span class="unit">'+esc(x.unit)+'</span></div></li>';
  }
  function renderList(){
    var el=document.getElementById("list");if(!el)return;
    var q=S.q.trim().toLowerCase(),v=S.venue;
    var rows=CAT[v].filter(function(x){
      if(q&&x.name.toLowerCase().indexOf(q)<0)return false;
      if(S.only&&!S.qty[v][x.id])return false;
      return true;
    });
    if(!rows.length){el.innerHTML='<li class="empty">Nothing found</li>';return}
    var s1=rows.filter(function(x){return x.stage}),rest=rows.filter(function(x){return !x.stage});
    if(!s1.length){el.innerHTML=rows.map(rowHtml).join("");return}
    el.innerHTML='<li class="sec s1">Stage 1 <small>'+s1.length+' items · launch 15.07</small></li>'+s1.map(rowHtml).join("")+
      (rest.length?'<li class="sec">Other semi-finished products <small>'+rest.length+' items</small></li>'+rest.map(rowHtml).join(""):"");
  }
  function plural(n){return n===1?"item":"items"}
  function renderBar(){
    if(S.done){bar.hidden=true;return}
    var n=count(S.venue);bar.hidden=false;
    barT.innerHTML=S.error?'<b style="color:#d9342b">Not sent</b>'+esc(S.error):'<b>'+n+' '+plural(n)+'</b>'+S.venue+' · for '+esc(dm(S.date))+(S.cooks[S.venue]?"":" · select who is ordering");
    sendBtn.disabled=S.busy||!n||!S.date||!S.cooks[S.venue];
    sendBtn.textContent=S.busy?"Sending…":"Send order";
  }
  function renderDone(){
    var s=S.done;
    return '<div class="done"><h1>Order sent</h1><div class="status'+(s.warn?" bad":"")+'">'+
      (s.warn?esc(s.warn):s.duplicate?"This order has already been sent.":"Order saved to the sheet and posted in the order thread.")+
      '</div><p class="sub">'+esc(s.venue)+' · for '+esc(dm(s.date))+' · '+s.count+' '+plural(s.count)+'</p>'+
      '<div class="acts">'+(tg?'<button class="btn" id="close" type="button">Close</button>':'')+'<button class="btn ghost" id="again" type="button">New order</button></div></div>';
  }
  function render(){
    app.innerHTML=S.done?renderDone():renderMain();
    if(!S.done)renderList();
    renderBar();
  }

  function setQty(id,val){
    S.error="";
    var m=S.qty[S.venue];if(val>0)m[id]=val;else delete m[id];
    persist();
    var row=app.querySelector('.row[data-id="'+id+'"]');
    if(row)row.classList.toggle("sel",val>0);
    var sm=app.querySelector('[data-venue="'+S.venue+'"] small');
    if(sm){var n=count(S.venue);sm.textContent=n?n+" selected":""}
    renderBar();
  }

  function stepBtn(t){
    var row=t.closest(".row");if(!row)return;
    var id=row.dataset.id,x=item(id),inp=row.querySelector("input");
    var cur=parseQ(inp.value),step=x.unit==="pcs"?1:0.5;
    var nv=t.dataset.act==="plus"?Math.round((cur+step)*100)/100:Math.max(0,Math.round((cur-step)*100)/100);
    inp.value=nv?fmt(nv):"";setQty(id,nv);
  }
  var holdT=null,holdI=null;
  function holdStop(){clearTimeout(holdT);clearInterval(holdI);holdT=holdI=null}
  app.addEventListener("pointerdown",function(e){
    var t=e.target.closest&&e.target.closest("button[data-act]");if(!t)return;
    if(e.pointerType==="mouse"&&e.button!==0)return;
    e.preventDefault();holdStop();
    stepBtn(t);
    holdT=setTimeout(function(){holdI=setInterval(function(){stepBtn(t)},110)},420);
  });
  ["pointerup","pointercancel","pointerleave","contextmenu"].forEach(function(n){
    app.addEventListener(n,function(e){if(holdT||holdI){if(n==="contextmenu"&&e.target.closest("button[data-act]"))e.preventDefault();holdStop()}},true);
  });
  window.addEventListener("blur",holdStop);

  app.addEventListener("click",function(e){
    var t=e.target.closest("button");if(!t)return;
    if(t.dataset.venue){S.venue=t.dataset.venue;S.q="";S.error="";render();if(!S.live[S.venue])loadCatalog(S.venue);return}
    if(t.id==="only"){S.only=!S.only;render();return}
    if(t.dataset.act){if(e.detail===0)stepBtn(t);return}
    if(t.id==="close"){try{tg.close()}catch(err){}return}
    if(t.id==="again"){S.done=null;S.q="";S.only=false;S.clientId=uid();render();window.scrollTo(0,0);return}
  });
  app.addEventListener("input",function(e){
    var t=e.target;
    if(t.hasAttribute("data-qty")){var row=t.closest(".row");setQty(row.dataset.id,parseQ(t.value));return}
    if(t.id==="q"){S.q=t.value;renderList();return}
    if(t.id==="comment"){S.comment=t.value;return}
  });
  app.addEventListener("change",function(e){
    var t=e.target;
    if(t.id==="date"){S.date=t.value;renderBar();return}
    if(t.id==="cook"){S.cooks[S.venue]=t.value;persist();renderBar();return}
    if(t.hasAttribute("data-qty")){var v=parseQ(t.value);t.value=v?fmt(v):""}
  });

  function showErr(){
    try{if(tg&&tg.showAlert){tg.showAlert(S.error);return}}catch(e){}
    try{alert(S.error)}catch(e){}
  }

  sendBtn.addEventListener("click",function(){
    var v=S.venue;
    var items=Object.keys(S.qty[v]).map(function(id){return {id:id,qty:S.qty[v][id]}});
    if(!items.length||!S.date||!S.cooks[v]||S.busy)return;
    S.busy=true;S.error="";renderBar();
    var payload={venue:v,forDate:S.date,cook:S.cooks[v],comment:S.comment.trim(),items:items,initData:(tg&&tg.initData)||"",clientId:S.clientId};
    var tries=0,timer=null;
    function attempt(){
      tries++;
      var ctl=("AbortController" in window)?new AbortController():null;
      timer=setTimeout(function(){if(ctl)ctl.abort()},15000);
      return fetch(API_URL,{method:"POST",body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined})
        .then(function(r){clearTimeout(timer);return r.json()})
        .catch(function(err){clearTimeout(timer);if(tries<3)return attempt();throw err});
    }
    attempt()
      .then(function(j){
        clearTimeout(timer);S.busy=false;
        if(j&&j.ok){
          S.done={venue:v,date:S.date,count:items.length,warn:j.warn||"",duplicate:!!j.duplicate};
          S.qty[v]={};S.comment="";persist();
          if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.notificationOccurred("success")}catch(e){}}
          render();window.scrollTo(0,0);
        }else{S.error=(j&&j.error)||"Could not send. Press the button again.";render();showErr()}
      })
      .catch(function(err){
        clearTimeout(timer);S.busy=false;
        S.error="No connection ("+(err&&err.message?err.message:"error")+"). Order not sent, items are kept. Press the button again.";render();showErr();
      });
  });

  render();
  loadCatalog(S.venue);
})();
</script>
</body>
</html>
